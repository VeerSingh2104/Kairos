services:
  - type: web
    name: kairos-ai
    runtime: docker
    plan: free
    dockerfilePath: ./ai-server/Dockerfile
    dockerContext: ./ai-server
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: REQUIRE_AUTH
        value: "true"
      - key: CORS_ORIGINS
        value: https://kairos-cc7cd.web.app,https://kairos-cc7cd.firebaseapp.com
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434
      - key: OLLAMA_MODEL
        value: qwen3:4b
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "120"
      - key: MAX_RESUME_CHARS
        value: "120000"
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

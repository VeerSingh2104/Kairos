name: Build Kairos

on:
  push:
    branches: ["kairos-rebuild"]
  pull_request:
    branches: ["main", "kairos-rebuild"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r ai-server/requirements.txt
      - run: python -m py_compile ai-server/main.py
